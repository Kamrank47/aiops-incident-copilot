groups:
  - name: service-health
    rules:
      - alert: HighErrorRate
        expr: sum by (service) (rate(http_requests_total{code=~"5.."}[5m])) > 0.5
        for: 2m
        labels: {severity: page}
        annotations: {summary: "5xx rate above 0.5/s"}
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: {severity: ticket}
        annotations: {summary: "p95 latency above 1s"}
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        labels: {severity: page}
        annotations: {summary: "Container restarting repeatedly"}
